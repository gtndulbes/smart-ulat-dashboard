<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="wormGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full background (tidak ada rounded corner — maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Content di safe zone -->
  <g filter="url(#glowFilter)" transform="translate(102, 102) scale(0.6)">
    <path d="M 130 330
             Q 130 240 200 240
             Q 270 240 270 330
             Q 270 420 340 420
             Q 400 420 400 360"
          fill="none"
          stroke="url(#wormGrad)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="400" cy="360" r="10" fill="#070b14"/>
    <circle cx="400" cy="360" r="4" fill="#67e8f9"/>
  </g>
</svg>